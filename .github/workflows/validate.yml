name: Validate storefront

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build and start stack
        run: docker compose up -d --build --wait

      - name: Run PHP validation gates
        run: bash scripts/run-gates.sh

      - name: Run PHPUnit suite
        run: docker compose --profile test run --rm test-runner

      - name: Upload compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Store failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
