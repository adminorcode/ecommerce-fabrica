name: petshop

x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
  WORDPRESS_DB_USER: ${MYSQL_USER}
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
  WORDPRESS_URL: ${WORDPRESS_URL}
  WORDPRESS_TITLE: ${WORDPRESS_TITLE}
  WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER}
  WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
  WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
  WP_CLI_ALLOW_ROOT: "1"

services:
  db:
    image: mariadb:11.4.5
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [internal]

  init:
    image: petshop-wordpress:local
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    environment: *wordpress-environment
    command: ["/usr/local/bin/init-wordpress"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wordpress_runtime:/var/www/html
      - wordpress_uploads:/var/www/html/wp-content/uploads
    networks: [internal]
    restart: "no"

  wordpress:
    image: petshop-wordpress:local
    depends_on:
      init:
        condition: service_completed_successfully
    environment: *wordpress-environment
    ports:
      - "127.0.0.1:${WORDPRESS_PORT}:80"
    volumes:
      - wordpress_runtime:/var/www/html
      - wordpress_uploads:/var/www/html/wp-content/uploads
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck-wordpress"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks: [internal]
    develop:
      watch:
        - action: sync+exec
          path: ./wp-content/plugins/petshop-core
          target: /var/www/html/wp-content/plugins/petshop-core
          initial_sync: true
          ignore: [vendor, .git, '*.log']
          exec:
            command: chown -R www-data:www-data /var/www/html/wp-content/plugins/petshop-core
        - action: sync+exec
          path: ./wp-content/themes/petshop-theme
          target: /var/www/html/wp-content/themes/petshop-theme
          initial_sync: true
          ignore: [.git, '*.log']
          exec:
            command: chown -R www-data:www-data /var/www/html/wp-content/themes/petshop-theme

  cli:
    image: petshop-wordpress:local
    profiles: [tools]
    environment:
      <<: *wordpress-environment
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    volumes:
      - wordpress_runtime:/var/www/html
      - wordpress_uploads:/var/www/html/wp-content/uploads
      - composer_cache:/tmp/composer-cache
    networks: [internal]
    entrypoint: []
    working_dir: /var/www/html

  node:
    image: petshop-node:local
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    volumes:
      - node_modules:/workspace/node_modules
      - npm_cache:/root/.npm
    networks: [internal]

  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    profiles: [tools]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT}:80"
    networks: [internal]

  test-db:
    image: mariadb:11.4.5
    profiles: [test]
    environment:
      MARIADB_DATABASE: ${MYSQL_TEST_DATABASE}
      MARIADB_USER: ${MYSQL_TEST_USER}
      MARIADB_PASSWORD: ${MYSQL_TEST_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD}
    volumes:
      - test_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [internal]

  test-init:
    image: petshop-wordpress:local
    profiles: [test]
    environment:
      WORDPRESS_DB_HOST: test-db:3306
      WORDPRESS_DB_NAME: ${MYSQL_TEST_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_TEST_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_TEST_PASSWORD}
      WORDPRESS_URL: http://test.local
      WORDPRESS_TITLE: Petshop Test
      WORDPRESS_ADMIN_USER: ${WORDPRESS_TEST_ADMIN_USER}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_TEST_ADMIN_PASSWORD}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_TEST_ADMIN_EMAIL}
    command: ["/usr/local/bin/init-wordpress"]
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - test_wordpress_runtime:/var/www/html
    networks: [internal]

  test-runner:
    image: petshop-wordpress:local
    profiles: [test]
    environment:
      WORDPRESS_DB_HOST: test-db:3306
      WORDPRESS_DB_NAME: ${MYSQL_TEST_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_TEST_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_TEST_PASSWORD}
    command: ["/usr/local/bin/test-runner"]
    depends_on:
      test-init:
        condition: service_completed_successfully
    volumes:
      - test_wordpress_runtime:/var/www/html
    networks: [internal]
    entrypoint: []

  backup:
    image: petshop-wordpress:local
    profiles: [migration]
    environment: *wordpress-environment
    command: ["/usr/local/bin/backup.sh"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - wordpress_runtime:/var/www/html
      - wordpress_uploads:/var/www/html/wp-content/uploads
      - migration_backups:/backups
    networks: [internal]
    entrypoint: []

  restore:
    image: petshop-wordpress:local
    profiles: [migration]
    environment: *wordpress-environment
    command: ["/usr/local/bin/restore.sh"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - wordpress_runtime:/var/www/html
      - wordpress_uploads:/var/www/html/wp-content/uploads
      - migration_backups:/backups
    networks: [internal]
    entrypoint: []

networks:
  internal:
    driver: bridge

volumes:
  wordpress_runtime:
  wordpress_uploads:
  mariadb_data:
  node_modules:
  composer_cache:
  npm_cache:
  test_wordpress_runtime:
  test_mariadb_data:
  migration_backups:
